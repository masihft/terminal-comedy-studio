[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-comedy-studio"
version = "0.1.0"
description = "An AI stand-up comedian that lives inside your terminal."
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{ name = "Terminal Comedy Studio contributors" }]
keywords = ["terminal", "tui", "comedy", "pixel-art", "persian"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
comedian = "terminal_comedian.main:main"
comedian-preview = "terminal_comedian.preview:main"

[project.urls]
Homepage = "https://github.com/masihft/terminal-comedy-studio"
Issues = "https://github.com/masihft/terminal-comedy-studio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"terminal_comedian.prompts" = ["*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
